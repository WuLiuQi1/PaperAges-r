name: iOS unsigned build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

jobs:
  unsigned-ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: paper_ages_reader
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test
      - run: flutter build ios --debug --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-build-products
          path: paper_ages_reader/build/ios/iphoneos
          if-no-files-found: error
          retention-days: 7
