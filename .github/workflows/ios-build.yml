name: iOS unsigned build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

jobs:
  unsigned-ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: paper_ages_reader
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for inspection
        run: |
          rm -rf build/ios/unsigned-ipa
          mkdir -p build/ios/unsigned-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned-ipa/Payload/
          cd build/ios/unsigned-ipa
          zip -qry ../PaperAges-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PaperAges-unsigned-ipa
          path: paper_ages_reader/build/ios/PaperAges-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
