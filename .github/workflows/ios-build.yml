name: iOS unsigned build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

jobs:
  unsigned-ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: paper_ages_reader
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - name: Prepare embedded frameworks for third-party signing
        run: |
          while IFS= read -r -d '' framework; do
            codesign --force --sign - "$framework"
            codesign --verify --strict "$framework"
          done < <(find build/ios/iphoneos/Runner.app/Frameworks \
            -type d -name '*.framework' -print0)
      - name: Package unsigned IPA for third-party signing
        run: |
          rm -rf Payload build/ios/unsigned
          mkdir -p Payload build/ios/unsigned
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent \
            Payload build/ios/unsigned/PaperAges-unsigned.ipa
      - name: Verify unsigned IPA structure
        run: |
          unzip -t build/ios/unsigned/PaperAges-unsigned.ipa
          unzip -l build/ios/unsigned/PaperAges-unsigned.ipa | \
            grep -q 'Payload/Runner.app/Info.plist'
      - uses: actions/upload-artifact@v4
        with:
          name: PaperAges-unsigned-ipa
          path: paper_ages_reader/build/ios/unsigned/PaperAges-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
